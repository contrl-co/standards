# Gates for the standards repository itself.
#
# The point of this repo is that a rule which can be enforced should be
# enforced. That applies here first: the prose rules are checked by a script,
# not by review.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prose:
    name: Prose rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check US English and attribution trailers
        run: scripts/check-prose.sh

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        # A 2.5 MB static binary pinned by version and checksum.
        # The runner image's apt shellcheck is 0.9.0 and
        # moves when the image does, so an unrelated pull request goes red
        # the day it moves.
        run: |
          set -euo pipefail
          version=v0.11.0
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$version/shellcheck-$version.linux.x86_64.tar.xz"
          echo "$sha256  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-$version/shellcheck" --severity=style scripts/*.sh

  templates:
    name: Template coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every template carries the non-negotiables
        shell: bash
        # A rule that exists only in CLAUDE.md is a rule that Cursor and
        # Copilot users never see. Each template restates the same short
        # list, so this checks they have not fallen out of sync.
        run: |
          set -euo pipefail
          templates=(
            templates/CLAUDE.md
            templates/AGENTS.md
            templates/github/copilot-instructions.md
            templates/cursor/contrl-standards.mdc
          )
          required=(
            "explicit approval in this"
            "Never present an assumption as a fact"
            "actually exists"
            "Dead code is forever"
            "Splitting a large diff"
            "not your idea of best practice"
            "US English"
            "AI attribution"
            "silence a linter"
            "Do the task as asked"
            "Report faithfully"
            "narrate progress into the issue tracker"
            "inventing a key"
            "Conventional Commits"
            "restate the code"
            "single-letter"
          )
          status=0
          for template in "${templates[@]}"; do
            for phrase in "${required[@]}"; do
              if ! grep -qF "$phrase" "$template"; then
                echo "::error file=$template::missing non-negotiable: $phrase"
                status=1
              fi
            done
          done
          exit $status

  sync:
    name: Sync round trip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vendor into a scratch repo and verify the drift check passes
        shell: bash
        # sync.sh and check-drift.sh only ever run in other repositories, so
        # nothing here would catch them breaking. This exercises both against
        # a throwaway consumer built from the working tree.
        run: scripts/selftest.sh

  gate:
    name: Gate summary
    if: always()
    needs: [prose, shell, templates, sync]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate
        env:
          PROSE: ${{ needs.prose.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          TEMPLATES: ${{ needs.templates.result }}
          SYNC: ${{ needs.sync.result }}
        run: |
          set -euo pipefail
          for result in "$PROSE" "$SHELL_RESULT" "$TEMPLATES" "$SYNC"; do
            if [ "$result" != success ]; then
              echo "::error::Required job result was $result."
              exit 1
            fi
          done
